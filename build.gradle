plugins {
    id 'net.minecraftforge.gradle' version '6.0.36' apply false
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.gradle'
    group = 'org.acivllas'
    version = '2.2.0'
    base.archivesName = "acivllas-${project.name}"
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    sourceSets.main.java.srcDir(rootProject.file('wire'))
    repositories { mavenCentral() }
    minecraft { mappings channel: 'official', version: '1.20.1' }
    dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.debug = false }
    tasks.named('jar').configure { finalizedBy 'reobfJar' }
}
